[project]
name = "ghosttrees-dataprep"
version = "0.1.0"
description = "Data pipeline for Ghost Trees web application."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "geopy>=2,<3",
    "pandas>=3,<4",
    "playwright>=1,<2"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.7,<1",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
